# Zizmor workflow-security linting.
#
# Runs zizmor on every push to main and on PRs that modify any workflow file.
# Pinned to an exact commit SHA per the pinning convention from issue #41.

name: Zizmor

on:
  push:
    branches: ["main"]
  pull_request:
    paths:
      - '.github/workflows/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  zizmor:
    name: Check workflow security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1
        with:
          inputs: >
            .
